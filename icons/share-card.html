<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share picture · CostTooling</title>
<!-- What icons/share-card.png is drawn from: the picture a text, an email or a post shows beside a link to the site.
     It is 1200 by 630. HANDOFF.md, under the sample job, has the command that redraws it. -->
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#f6f5f1;color:#161617;font:17px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;gap:56px;padding:0 64px;box-sizing:border-box}
*{box-sizing:border-box}
.txt{flex:1 1 0;min-width:0}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.mark{width:54px;height:54px;border-radius:14px;background:#e8c547;font-weight:900;font-size:21px;display:flex;align-items:center;justify-content:center;letter-spacing:-.5px;flex:none}
.brand b{font-size:28px;letter-spacing:-.3px}
h1{font-size:64px;line-height:1.04;letter-spacing:-1.8px;margin:0 0 24px;font-weight:800;text-wrap:balance}
.lead{font-size:26px;line-height:1.35;color:#3a3936;margin:0;text-wrap:balance}
.report{flex:none;width:430px;background:#fff;border:1px solid #e2dfd6;border-radius:20px;padding:26px 24px;box-shadow:0 22px 48px rgba(22,22,23,.14)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hd .mark{width:40px;height:40px;border-radius:10px;background:#161617;color:#e8c547;font-size:15px}
.hd h2{margin:0;font-size:22px;line-height:1.2}
.hd p{margin:2px 0 0;color:#6b6a66;font-size:15px}
.num{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.num div{flex:1 1 40%;background:#f6f5f1;border-radius:10px;padding:12px 8px;text-align:center}
.num b{display:block;font-size:30px;letter-spacing:-.5px;line-height:1.15}
.num span{font-size:15px;color:#6b6a66}
.num .warn{background:#fbf4e4}
.num .warn b,.num .warn span{color:#7a4f0d}
.flag{background:#fbf4e4;border:1px solid #ead9b2;border-radius:12px;padding:12px 14px;color:#7a4f0d;font-size:18px;line-height:1.35;text-wrap:balance}
.flag b{color:#5e3c08}
</style></head>
<body>
<div class="txt">
  <div class="brand"><div class="mark">CT</div><b>CostTooling</b></div>
  <h1>See what's really done before you pay for it.</h1>
  <p class="lead">Walk the site, take photos, and send the owner one page.</p>
</div>
<div class="report">
  <div class="hd"><div class="mark">CT</div><div><h2>Owner update</h2><p>Maple St Duplex — Unit B</p></div></div>
  <div class="num">
    <div><b>36%</b><span>done</span></div>
    <div><b>38%</b><span>billed</span></div>
    <div class="warn"><b>$3,420</b><span>billed ahead</span></div>
    <div><b>68</b><span>days left</span></div>
  </div>
  <div class="flag"><b>Framing is billed at 100%.</b><br>On site it is 85%.</div>
</div>
</body></html>
