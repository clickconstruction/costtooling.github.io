name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # The deploy step looks for the upload about half a second after it finishes, and GitHub sometimes
      # does not list it yet: "No artifacts named github-pages were found". So a first try that fails
      # does not fail the run. The steps below wait and try once more, with the same upload.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        name: Deploy, second try
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
